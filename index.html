<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rak Buku</title>
<style>
:root{--bg:#eef2ee;--ink:#1d2b24;--muted:#5d6b64;--line:#c9d3cb;--pine:#1f4d3a;--brick:#b4452c;--card:#fbfcfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Georgia,"Times New Roman",serif}
header{background:var(--pine);color:#eef2ee;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font-size:22px;letter-spacing:.5px;margin-right:auto}
header a,header button{color:#eef2ee;background:none;border:0;font:inherit;cursor:pointer;text-decoration:none;padding:4px 2px;border-bottom:2px solid transparent}
header a:hover,header button:hover,header a.on{border-bottom-color:#e9b44c}
main{max-width:760px;margin:0 auto;padding:24px 20px 60px}
h2{margin:0 0 16px;font-size:26px}
.book{display:block;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--pine);padding:14px 16px;margin-bottom:12px;color:inherit;text-decoration:none}
.book:hover{border-left-color:var(--brick)}
.book b{font-size:19px}
.meta{color:var(--muted);font-size:14px}
label{display:block;margin:14px 0 4px;font-weight:bold}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);background:#fff;font:inherit;border-radius:2px}
input:focus,textarea:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid #e9b44c;outline-offset:1px}
.btn{margin-top:18px;background:var(--brick);color:#fff;border:0;padding:10px 20px;font:inherit;cursor:pointer;border-radius:2px}
.btn:hover{background:#963821}
.msg{margin-top:14px;padding:10px 12px;border:1px solid var(--line);background:var(--card)}
.msg.err{border-color:var(--brick);color:#8a2f1b}
.msg.ok{border-color:var(--pine);color:var(--pine)}
.back{display:inline-block;margin-bottom:14px;color:var(--pine)}
</style>
</head>
<body>
<header>
  <h1>Rak Buku</h1>
  <a href="#/books" id="n-books">Buku</a>
  <a href="#/authors" id="n-authors">Penulis</a>
  <a href="#/add" id="n-add">Tambah buku</a>
  <a href="#/login" id="n-login">Masuk</a>
  <button id="n-logout" hidden>Keluar</button>
</header>
<main id="app"></main>

<script>
const API = "http://localhost:3000";
const app = document.getElementById("app");

function getToken(){ try { return localStorage.getItem("token"); } catch(e){ return null; } }
function setToken(t){ try { t ? localStorage.setItem("token", t) : localStorage.removeItem("token"); } catch(e){} }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function api(path, opts = {}){
  const headers = { "Content-Type": "application/json" };
  const t = getToken();
  if (t) headers.Authorization = "Bearer " + t;
  const res = await fetch(API + path, { ...opts, headers });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.pesan || body.message || "Permintaan gagal (" + res.status + ")");
  return body;
}

function updateNav(){
  const on = !!getToken();
  document.getElementById("n-login").hidden = on;
  document.getElementById("n-logout").hidden = !on;
  const hash = location.hash || "#/books";
  ["books","authors","add","login"].forEach(k => {
    document.getElementById("n-" + k).classList.toggle("on", hash.startsWith("#/" + k));
  });
}

document.getElementById("n-logout").onclick = () => { setToken(null); location.hash = "#/login"; route(); };

async function viewBooks(){
  app.innerHTML = "<h2>Daftar buku</h2><p class='meta'>Memuat buku...</p>";
  const { data } = await api("/books");
  app.innerHTML = "<h2>Daftar buku</h2>" + (data.length ? data.map(b =>
    `<a class="book" href="#/books/${esc(b.slug)}"><b>${esc(b.title)}</b><div class="meta">${b.year ? esc(b.year) : "Tahun belum diisi"}</div></a>`
  ).join("") : "<p>Belum ada buku. Tambah buku pertama lewat menu Tambah buku.</p>");
}

async function viewBook(slug){
  app.innerHTML = "<p class='meta'>Memuat detail buku...</p>";
  const { data } = await api("/books/" + encodeURIComponent(slug));
  app.innerHTML = `<a class="back" href="#/books">Kembali ke daftar</a>
    <h2>${esc(data.title)}</h2>
    <p class="meta">Penulis: ${esc(data.author.name)} | Tahun: ${data.year ? esc(data.year) : "belum diisi"}</p>
    <p>${data.description ? esc(data.description) : "Deskripsi belum diisi."}</p>`;
}

async function viewAuthors(){
  app.innerHTML = "<h2>Penulis</h2><p class='meta'>Memuat penulis...</p>";
  const data = await api("/authors");
  app.innerHTML = "<h2>Penulis</h2>" + data.map(a =>
    `<a class="book" href="#/authors/${esc(a.slug)}"><b>${esc(a.name)}</b></a>`).join("");
}

async function viewAuthor(slug){
  const a = await api("/authors/" + encodeURIComponent(slug));
  app.innerHTML = `<a class="back" href="#/authors">Kembali ke penulis</a>
    <h2>${esc(a.name)}</h2>
    ${a.books.length ? a.books.map(b => `<div class="book"><b>${esc(b.title)}</b></div>`).join("") : "<p>Penulis ini belum punya buku.</p>"}`;
}

function viewLogin(){
  app.innerHTML = `<h2>Masuk</h2>
    <form id="f">
      <label for="email">Email</label><input id="email" type="email" required>
      <label for="pw">Password</label><input id="pw" type="password" required>
      <button class="btn" type="submit">Masuk</button>
    </form><div id="out"></div>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const out = document.getElementById("out");
    try {
      const r = await api("/login", { method: "POST", body: JSON.stringify({ email: email.value, password: pw.value }) });
      setToken(r.data.token);
      location.hash = "#/books";
    } catch (err) { out.innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  };
}

async function viewAdd(){
  if (!getToken()){
    app.innerHTML = `<h2>Tambah buku</h2><div class="msg err">Kamu harus masuk dulu. <a href="#/login">Masuk di sini</a>.</div>`;
    return;
  }
  const authors = await api("/authors");
  app.innerHTML = `<h2>Tambah buku</h2>
    <form id="f">
      <label for="title">Judul</label><input id="title" required maxlength="200">
      <label for="author">Penulis</label>
      <select id="author">${authors.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}</select>
      <label for="year">Tahun terbit</label><input id="year" type="number" min="1000" max="${new Date().getFullYear()}">
      <label for="desc">Deskripsi</label><textarea id="desc" rows="4"></textarea>
      <button class="btn" type="submit">Simpan buku</button>
    </form><div id="out"></div>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const out = document.getElementById("out");
    const body = { title: title.value, author_id: author.value, description: desc.value };
    if (year.value) body.year = Number(year.value);
    try {
      const r = await api("/books", { method: "POST", body: JSON.stringify(body) });
      out.innerHTML = `<div class="msg ok">Buku "${esc(r.data.title)}" tersimpan. <a href="#/books/${esc(r.data.slug)}">Lihat detail</a></div>`;
      e.target.reset();
    } catch (err) { out.innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  };
}

async function route(){
  updateNav();
  const h = (location.hash || "#/books").slice(2).split("/");
  try {
    if (h[0] === "books" && h[1]) await viewBook(h[1]);
    else if (h[0] === "authors" && h[1]) await viewAuthor(h[1]);
    else if (h[0] === "authors") await viewAuthors();
    else if (h[0] === "add") await viewAdd();
    else if (h[0] === "login") viewLogin();
    else await viewBooks();
  } catch (err) {
    app.innerHTML = `<div class="msg err">${esc(err.message)}. Pastikan server backend berjalan di ${API}.</div>`;
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
